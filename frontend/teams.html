<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Management - Cricket Stats DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container-fluid max-w-7xl">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="fas fa-baseball-bat-ball text-emerald fs-4"></i>
                <span>Cric</span>Stats DB
            </a>
            <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-1">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-gauge-high me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/players"><i class="fas fa-user-group me-1"></i> Players</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/teams"><i class="fas fa-shield-halved me-1"></i> Teams</a></li>
                    <li class="nav-item"><a class="nav-link" href="/matches"><i class="fas fa-trophy me-1"></i> Matches</a></li>
                    <li class="nav-item"><a class="nav-link" href="/statistics"><i class="fas fa-chart-pie me-1"></i> Leaderboards</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <h2 class="fw-bold mb-1 text-white">Team Management & Squads</h2>
                <p class="text-muted mb-0">Monitor participating cricket teams, rosters, and win percentages.</p>
            </div>
            <div>
                <button class="btn btn-emerald" data-bs-toggle="modal" data-bs-target="#addTeamModal">
                    <i class="fas fa-plus me-1"></i> Add New Team
                </button>
            </div>
        </div>

        <div class="row" id="teamsGrid">
            <div class="col-12 text-center py-5 text-muted">Loading teams...</div>
        </div>

    </main>

    <!-- Modal: Add New Team -->
    <div class="modal fade" id="addTeamModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-white"><i class="fas fa-shield-halved text-emerald me-2"></i>Add New Team</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="addTeamForm">
                    <div class="modal-body">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Team Name *</label>
                                <input type="text" id="teamName" class="form-control" required placeholder="e.g. India">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Country / Region</label>
                                <input type="text" id="teamCountry" class="form-control" placeholder="e.g. India">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Team Type</label>
                                <select id="teamType" class="form-select">
                                    <option value="International">International</option>
                                    <option value="Franchise">Franchise</option>
                                    <option value="Domestic">Domestic</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-emerald">Save Team</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal: View Squad -->
    <div class="modal fade" id="teamSquadModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold text-white" id="squadModalTitle">Team Squad</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <h6 class="fw-bold text-white mb-3"><i class="fas fa-users text-emerald me-2"></i>Squad Members</h6>
                    <div id="teamSquadList" class="p-2 card-dark"></div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <div><strong>Cricket Stats Management & Monitoring Database</strong></div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", initTeamsPage);
    </script>
</body>
</html>
